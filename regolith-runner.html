<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Regolith Runner</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 30%, #1b1626 0%, #07060b 70%);
  color: #cbb;
  font-family: "Courier New", Consolas, monospace;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
}
.cabinet {
  --h: min(60vh, calc((100vw - 72px) * 0.7));
  display: flex; flex-direction: column; align-items: stretch;
  width: calc(var(--h) * 320 / 224 + 56px);
  background: linear-gradient(#2a2233, #17121d);
  border: 3px solid #0a0810; border-radius: 14px 14px 6px 6px;
  box-shadow: 0 0 0 2px #3b3047 inset, 0 20px 60px #000;
  padding: 10px 14px 8px;
}
.marquee {
  text-align: center; padding: 8px 0; margin-bottom: 10px;
  background: linear-gradient(#ff9a3c, #c8431e); border: 2px solid #0a0810; border-radius: 6px;
  box-shadow: 0 0 18px #ff7a2a88, 0 0 30px #fff3 inset;
}
.marquee span {
  font-weight: 900; letter-spacing: .35em; font-size: clamp(14px, 3.2vh, 28px);
  color: #1a0b2a; text-shadow: 1px 1px 0 #ffd9a0;
}
.bezel { background: #050407; border-radius: 10px; padding: 12px; border: 2px solid #000; }
.tube { position: relative; height: var(--h); border-radius: 12px; overflow: hidden; background: #000;
  box-shadow: 0 0 24px #3fd0c033; }
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.scanlines { position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%);
}
.panel { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 4px 4px; }
.group { display: flex; gap: 10px; align-items: center; }
.group.mid { flex-direction: column; gap: 6px; }
button { font: inherit; cursor: pointer; touch-action: none; }
.btn {
  border: 2px solid #000; color: #fff; font-weight: 700; font-size: 12px;
  box-shadow: 0 4px 0 #000, 0 0 0 2px #fff2 inset;
}
.btn:active, .btn.down { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
.btn.dir { width: 46px; height: 46px; border-radius: 50%; background: #3a6ad0; }
.btn.act { width: 58px; height: 58px; border-radius: 50%; }
.btn.jump { background: #2aa890; }
.btn.fire { background: #d0442a; }
.btn.start { background: #e0e0e0; color: #111; border-radius: 4px; padding: 4px 10px; }
.coin {
  display: flex; align-items: center; gap: 8px; background: #111; border: 2px solid #555;
  border-radius: 4px; padding: 5px 10px; color: #ffb347;
}
.coin .slot { width: 6px; height: 22px; background: #000; border: 1px solid #888; border-radius: 2px; }
.coin .coinlabel { font-size: 11px; font-weight: 700; animation: glow 1.2s infinite alternate; }
.coin:active { background: #332; }
@keyframes glow { from { text-shadow: 0 0 2px #ff7a2a; } to { text-shadow: 0 0 10px #ffb347; } }
.help { text-align: center; font-size: 11px; color: #776a80; padding-top: 6px; }
.help b { color: #b9a; }
@media (max-height: 520px) { .help { display: none; } }

</style>
</head>
<body>
<div class="cabinet">
  <div class="marquee"><span>REGOLITH RUNNER</span></div>
  <div class="bezel">
    <div class="tube">
      <canvas id="screen" width="320" height="224"></canvas>
      <div class="scanlines"></div>
    </div>
  </div>
  <div class="panel">
    <div class="group">
      <button class="btn dir" data-action="left" aria-label="Slow down">&#9664;</button>
      <button class="btn dir" data-action="right" aria-label="Speed up">&#9654;</button>
    </div>
    <div class="group mid">
      <button class="coin" data-action="coin" aria-label="Insert coin">
        <span class="slot"></span><span class="coinlabel">INSERT COIN</span>
      </button>
      <button class="btn start" data-action="start">1P START</button>
    </div>
    <div class="group">
      <button class="btn act jump" data-action="jump">JUMP</button>
      <button class="btn act fire" data-action="fire">FIRE</button>
    </div>
  </div>
  <div class="help">
    <b>C</b>/<b>5</b> coin &middot; <b>Enter</b>/<b>1</b> start &middot; <b>&larr; &rarr;</b> speed &middot;
    <b>&uarr;</b>/<b>Space</b> jump &middot; <b>Z</b>/<b>X</b> fire &middot; <b>P</b> pause &middot; <b>M</b> mute
  </div>
</div>
<script>
// Regolith Runner - an original coin-op style rover game. No external assets.
(() => {
'use strict';

const W = 320, H = 224, GY = 178, SECLEN = 1500, SECTORS = 20;
const cv = document.getElementById('screen');
const g = cv.getContext('2d');

// ---------------------------------------------------------------- font (5x7, column bytes)
const FONT_SRC = {
  ' ': '0000000000', '!': '00005F0000', '-': '0808080808', '.': '0060600000', ':': '0036360000',
  '/': '2010080402', '+': '08083E0808', '<': '0814224100', '>': '0041221408', '?': '0201510906',
  ',': '0050300000', "'": '0005030000', '=': '1414141414', '_': '4040404040',
  '0': '3E5149453E', '1': '00427F4000', '2': '4261514946', '3': '2141454B31', '4': '1814127F10',
  '5': '2745454539', '6': '3C4A494930', '7': '0171090503', '8': '3649494936', '9': '064949291E',
  A: '7E1111117E', B: '7F49494936', C: '3E41414122', D: '7F4141221C', E: '7F49494941',
  F: '7F09090901', G: '3E4149497A', H: '7F0808087F', I: '00417F4100', J: '2040413F01',
  K: '7F08142241', L: '7F40404040', M: '7F020C027F', N: '7F0408107F', O: '3E4141413E',
  P: '7F09090906', Q: '3E4151215E', R: '7F09192946', S: '4649494931', T: '01017F0101',
  U: '3F4040403F', V: '1F2040201F', W: '3F4038403F', X: '6314081463', Y: '0708700807',
  Z: '6151494543'
};
const FONT = {};
for (const k in FONT_SRC) {
  FONT[k] = [0, 1, 2, 3, 4].map(i => parseInt(FONT_SRC[k].substr(i * 2, 2), 16));
}
function text(s, x, y, col, sc = 1) {
  g.fillStyle = col;
  s = String(s);
  for (let i = 0; i < s.length; i++) {
    const gl = FONT[s[i]] || FONT['?'];
    for (let c = 0; c < 5; c++) {
      const bits = gl[c];
      if (!bits) continue;
      for (let r = 0; r < 7; r++) if (bits >> r & 1) g.fillRect(x + c * sc, y + r * sc, sc, sc);
    }
    x += 6 * sc;
  }
}
function ctext(s, y, col, sc = 1) {
  s = String(s);
  text(s, Math.round((W - s.length * 6 * sc + sc) / 2), y, col, sc);
}
const pad = (n, w) => String(n).padStart(w, '0');

// ---------------------------------------------------------------- input
const KEYMAP = {
  KeyC: 'coin', Digit5: 'coin', Numpad5: 'coin',
  Digit1: 'start', Numpad1: 'start', Enter: 'start', NumpadEnter: 'start',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', Space: 'jump', KeyW: 'jump',
  KeyZ: 'fire', KeyX: 'fire', KeyF: 'fire', KeyJ: 'fire',
  KeyP: 'pause', KeyM: 'mute'
};
const down = {}, just = {};
function press(a) { if (!down[a]) just[a] = true; down[a] = true; }
function release(a) { down[a] = false; }

window.addEventListener('keydown', e => {
  audioInit();
  if (state === 'initials' && !e.repeat) {
    if (/^Key[A-Z]$/.test(e.code)) { iniType(e.code.charCodeAt(3) - 65); e.preventDefault(); return; }
    if (e.code === 'Backspace') { if (ini.pos > 0) ini.pos--; e.preventDefault(); return; }
  }
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  if (!e.repeat) press(a);
});
window.addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
window.addEventListener('blur', () => { for (const k in down) down[k] = false; });

document.querySelectorAll('[data-action]').forEach(b => {
  const a = b.getAttribute('data-action');
  b.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); press(a); b.classList.add('down'); });
  const up = () => { release(a); b.classList.remove('down'); };
  b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// ---------------------------------------------------------------- audio (all synthesized)
let ac = null, master = null, muted = false, noiseBuf = null;
function audioInit() {
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.22;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (err) { ac = null; }
}
function tone(f0, f1, dur, type = 'square', vol = 0.4, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), v = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  v.gain.setValueAtTime(vol, t);
  v.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(v); v.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.5, delay = 0, freq = 1200) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
  s.buffer = noiseBuf; s.loop = true;
  f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t);
  f.frequency.exponentialRampToValueAtTime(80, t + dur);
  v.gain.setValueAtTime(vol, t);
  v.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(v); v.connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  coin() { tone(988, 988, 0.08, 'square', 0.4); tone(1319, 1319, 0.3, 'square', 0.4, 0.08); },
  start() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 'square', 0.35, i * 0.1)); },
  jump() { tone(200, 620, 0.2, 'square', 0.25); },
  fire() { tone(950, 220, 0.09, 'square', 0.2); },
  boom() { noise(0.3, 0.6); },
  bomb() { noise(0.2, 0.35, 0, 600); },
  die() { noise(1.0, 0.9, 0, 2000); tone(420, 40, 0.9, 'sawtooth', 0.35); },
  bonus() { [659, 784, 988, 1319, 988, 1319].forEach((f, i) => tone(f, f, 0.09, 'square', 0.3, i * 0.08)); },
  life() { [784, 1047, 1319, 1568].forEach((f, i) => tone(f, f, 0.1, 'triangle', 0.5, i * 0.09)); },
  tick() { tone(660, 660, 0.04, 'square', 0.2); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, f, 0.3, 'triangle', 0.5, i * 0.28)); }
};
// original looping tune: bass + lead, 32 steps
const BASS = [45, 0, 45, 48, 0, 52, 0, 45, 43, 0, 43, 47, 0, 50, 0, 43, 41, 0, 41, 45, 0, 48, 0, 41, 40, 0, 40, 44, 0, 47, 52, 0];
const LEAD = [69, 0, 0, 72, 0, 76, 0, 0, 74, 0, 0, 71, 0, 67, 0, 0, 72, 0, 0, 69, 0, 65, 0, 0, 64, 0, 68, 0, 71, 0, 76, 0];
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
let musStep = 0, musNext = 0;
function music(on) {
  if (!ac || muted || !on) { musNext = 0; return; }
  if (musNext < ac.currentTime) musNext = ac.currentTime + 0.05;
  while (musNext < ac.currentTime + 0.2) {
    const d = musNext - ac.currentTime, i = musStep % 32;
    if (BASS[i]) tone(mf(BASS[i]), mf(BASS[i]), 0.13, 'triangle', 0.55, d);
    if (LEAD[i]) tone(mf(LEAD[i]), mf(LEAD[i]), 0.16, 'square', 0.1, d);
    musStep++; musNext += 0.135;
  }
}

// ---------------------------------------------------------------- helpers
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hash = n => (Math.imul(n | 0, 2654435761) >>> 8) & 0xffff;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const groundY = wx => GY + Math.round(Math.sin(wx * 0.013) * 3 + Math.sin(wx * 0.031) * 2);
function spr(map, pal, x, y) {
  for (let r = 0; r < map.length; r++) {
    const row = map[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      g.fillStyle = pal[ch];
      g.fillRect(x + c, y + r, 1, 1);
    }
  }
}

// ---------------------------------------------------------------- sprites
const SPR_ENEMY = [
  { w: 11, h: 5, pts: 100, pal: { a: '#e85ad0', b: '#ffd0f4', c: '#fff36b', d: '#8a2a7c' },
    map: ['...aaaaa...', '.aabbbbbaa.', 'aabcbcbcbaa', '.aaaaaaaaa.', '..d.....d..'] },
  { w: 11, h: 6, pts: 200, pal: { a: '#6be06b', b: '#e8ffe0', c: '#ff5a3c', d: '#2c8a3a' },
    map: ['....aaa....', '...abbba...', 'aaaabbbaaaa', 'acaaaaaaaca', '.aaa.d.aaa.', '.....d.....'] },
  { w: 9, h: 7, pts: 300, pal: { a: '#ff6a3c', b: '#ffe08a', c: '#ffffff' },
    map: ['a.......a', 'aa.....aa', 'aaabbbaaa', '.aabcbaa.', '..aabaa..', '...aaa...', '....a....'] }
];
const ROCK_S = [4, 6, 8, 10, 10, 10];
const ROCK_B = [4, 6, 8, 10, 12, 12, 14, 14, 14, 14, 14, 14, 14, 14];
const WHEEL = [3, 5, 7, 7, 7, 5, 3];

function drawRock(x, gy, rows, w) {
  for (let i = 0; i < rows.length; i++) {
    const rw = rows[i], rx = x + ((w - rw) >> 1), ry = gy - rows.length + i;
    g.fillStyle = '#7a5a8c'; g.fillRect(rx, ry, rw, 1);
    g.fillStyle = '#c3a6d6'; g.fillRect(rx, ry, Math.max(1, rw >> 2), 1);
    g.fillStyle = '#48305a'; g.fillRect(rx + rw - Math.max(1, rw >> 2), ry, Math.max(1, rw >> 2), 1);
  }
}
function drawWheel(cx, bottom, spin) {
  for (let i = 0; i < 7; i++) {
    g.fillStyle = '#2a1e3c';
    g.fillRect(cx - (WHEEL[i] >> 1), bottom - 7 + i, WHEEL[i], 1);
  }
  g.fillStyle = '#b8a8d8'; g.fillRect(cx - 1, bottom - 5, 3, 3);
  g.fillStyle = '#ffb347';
  const s = spin & 3;
  g.fillRect(cx + [0, 2, 0, -2][s], bottom - 4 + [-2, 0, 2, 0][s], 1, 1);
}
function drawRover(sx, wy, spin) {
  const by = Math.round((wy[0] + wy[1] + wy[2]) / 3) - 5;
  g.fillStyle = '#ff9a3c'; g.fillRect(sx + 5, by - 6, 11, 2);          // forward gun
  g.fillRect(sx - 7, by - 12, 2, 4);                                    // upward gun
  g.fillStyle = '#3fd0c0'; g.fillRect(sx - 13, by - 4, 27, 4);          // chassis
  g.fillRect(sx + 14, by - 3, 2, 2);
  g.fillStyle = '#1c7c74'; g.fillRect(sx - 13, by - 1, 27, 1);
  g.fillStyle = '#8ef0e4'; g.fillRect(sx - 9, by - 8, 14, 4);           // cabin
  g.fillStyle = '#eaffff'; g.fillRect(sx - 2, by - 11, 7, 3); g.fillRect(sx - 1, by - 12, 5, 1);
  g.fillStyle = '#2a6ad0'; g.fillRect(sx, by - 10, 4, 2);               // canopy glass
  drawWheel(sx - 10, wy[0], spin); drawWheel(sx, wy[1], spin + 1); drawWheel(sx + 10, wy[2], spin + 2);
}

// ---------------------------------------------------------------- background data
const stars = [];
{
  const r = rng(77);
  for (let i = 0; i < 70; i++) stars.push({ x: r() * W, y: r() * 130, c: r() > 0.8 ? '#fff' : r() > 0.5 ? '#9ab' : '#556', tw: r() * 6 });
}
const FAR = new Array(512), NEAR = new Array(512);
for (let i = 0; i < 512; i++) {
  const a = i / 512 * Math.PI * 2;
  FAR[i] = Math.round(34 + 15 * Math.sin(a * 3) + 9 * Math.sin(a * 7 + 1) + 4 * Math.sin(a * 17 + 2));
  const n = 16 + 9 * Math.sin(a * 5 + 0.5) + 6 * Math.sin(a * 13 + 2) + 3 * Math.sin(a * 29);
  NEAR[i] = Math.floor(n / 3) * 3;
}
function drawBackground(cam, t) {
  g.fillStyle = '#080818'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#10102c'; g.fillRect(0, 90, W, 40);
  g.fillStyle = '#1a1440'; g.fillRect(0, 120, W, 40);
  for (const s of stars) {
    if (Math.sin(t * 2 + s.tw) < -0.85) continue;
    g.fillStyle = s.c;
    g.fillRect(((s.x - cam * 0.015) % W + W) % W | 0, s.y | 0, 1, 1);
  }
  // ringed planet
  const px = 240, py = 44, pr = 19;
  for (let dy = -pr; dy <= pr; dy++) {
    const hw = Math.round(Math.sqrt(pr * pr - dy * dy));
    g.fillStyle = ['#e8b05a', '#d08a48', '#f0c878', '#b86a3c'][(dy + pr >> 2) & 3];
    g.fillRect(px - hw, py + dy, hw * 2, 1);
    g.fillStyle = 'rgba(0,0,20,.45)';
    g.fillRect(px + (hw >> 1), py + dy, hw - (hw >> 1), 1);
  }
  g.fillStyle = '#c8d8ff';
  for (let i = 0; i < 140; i++) {
    const a = i / 140 * Math.PI * 2, ex = Math.cos(a) * 34, ey = Math.sin(a) * 6;
    if (ey < 0 && Math.abs(ex) < pr - 1) continue;
    g.fillRect(Math.round(px + ex), Math.round(py + ey + ex * 0.12), 1, 1);
  }
  const fo = Math.floor(cam * 0.12), no = Math.floor(cam * 0.35);
  g.fillStyle = '#3b2a6b';
  for (let x = 0; x < W; x++) { const h = FAR[(x + fo) & 511]; g.fillRect(x, 162 - h, 1, h + 30); }
  g.fillStyle = '#5a45a0';
  for (let x = 0; x < W; x++) { const h = FAR[(x + fo) & 511]; g.fillRect(x, 162 - h, 1, 1); }
  g.fillStyle = '#17414c';
  for (let x = 0; x < W; x++) { const h = NEAR[(x + no) & 511]; g.fillRect(x, 174 - h, 1, h + 20); }
  g.fillStyle = '#2a7480';
  for (let x = 0; x < W; x++) { const h = NEAR[(x + no) & 511]; g.fillRect(x, 174 - h, 1, 1); }
}

// ---------------------------------------------------------------- game state
let state = 'attract', stT = 0, T = 0, paused = false;
let credits = 0, score = 0, hiscore = 0, lives = 0, nextLife = 10000;
let sector = 0, cpTime = 0, cam = 0, spin = 0;
let obstacles = [], pits = [], waves = [], enemies = [], bombs = [], shots = [], parts = [], floats = [];
let generated = {}, banner = null, waveId = 0;
const rover = { x: 0, alt: 0, vy: 0, vx: 75, onGround: true, sx: 70 };
const ini = { pos: 0, ch: [0, 0, 0] };

let scores;
try { scores = JSON.parse(localStorage.getItem('regolith-runner-scores')); } catch (e) { scores = null; }
if (!Array.isArray(scores) || scores.length !== 5) {
  scores = [{ n: 'RGR', s: 12000 }, { n: 'ION', s: 9000 }, { n: 'VEX', s: 7000 }, { n: 'KAI', s: 5000 }, { n: 'ZED', s: 3000 }];
}
hiscore = scores[0].s;
function saveScores() { try { localStorage.setItem('regolith-runner-scores', JSON.stringify(scores)); } catch (e) { /* ignore */ } }

function setState(s) { state = s; stT = 0; }
const diff = s => (s % SECTORS) + Math.floor(s / SECTORS) * 8;

function genSector(s) {
  if (generated[s]) return;
  generated[s] = true;
  const r = rng(s * 7919 + 13), d = diff(s), x0 = s * SECLEN;
  let x = x0 + (s === 0 ? 300 : 190);
  const opts = ['pitS', 'rockS', 'pitS', 'rockS'];
  if (d >= 2) opts.push('rockB');
  if (d >= 3) opts.push('pitW');
  if (d >= 5) opts.push('mine', 'pitW');
  if (d >= 7) opts.push('boulder');
  if (d >= 9) opts.push('combo');
  if (d >= 11) opts.push('twin', 'boulder');
  const rock = (px, big) => obstacles.push(big
    ? { type: 'rockB', x: px, w: 14, h: 14, hp: 2, pts: 200 }
    : { type: 'rockS', x: px, w: 10, h: 6, hp: 1, pts: 100 });
  const pit = (px, w) => pits.push({ x: px, w });
  while (x < x0 + SECLEN - 80) {
    const k = opts[Math.floor(r() * opts.length)];
    let w = 0;
    if (k === 'pitS') { w = 18 + Math.floor(r() * 8); pit(x, w); }
    else if (k === 'pitW') { w = 40 + Math.floor(r() * 12); pit(x, w); }
    else if (k === 'rockS') { w = 10; rock(x, false); }
    else if (k === 'rockB') { w = 14; rock(x, true); }

  }
  if (banner && state === 'play') {
    banner.lines.forEach((l, i) => ctext(l, 50 + i * 14, i === 0 ? '#fff36b' : '#fff', i === 0 ? 2 : 1));
  }
  if (paused) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, W, H); ctext('PAUSED', 96, '#fff', 3); }
}

// ---------------------------------------------------------------- main loop
let last = 0;
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0);
  last = ts;
  if (just.pause && (state === 'play' || paused)) paused = !paused;
  if (!paused) update(dt);
  music(!paused && state === 'play');
  draw();
  for (const k in just) just[k] = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();

</script>
